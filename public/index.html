<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);background:#F5EEF4}body{margin:0;padding:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column; the bottleneck card leads, the four-area life map sits beneath it. Light-only by brand rule (DESIGN.md). */
:root{
  --purple:#653CAD; --deep:#3E2470; --gold:#F7C364; --lav:#E6DDF3; --mauve:#C9A0C4;
  --bg:#F5EEF4; --surface:#FFFFFF; --text:#2A2433; --muted:#6B6475; --inset:#FAF6F9; --line:#EADCE7;
  --font:"IBM Plex Sans Arabic", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:600;color:var(--purple);line-height:1.2;text-wrap:balance}
h2{font-size:clamp(20px,3.6vw,24px);font-weight:500;color:var(--purple);line-height:1.4;text-wrap:balance}
h3{font-size:18px;font-weight:500;color:var(--deep);line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:14px}
header{display:flex;flex-direction:column;gap:4px}
.card{background:var(--surface);border:0.5px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.soft{background:var(--lav);border:none}
.soft h3,.soft p{color:var(--deep)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}

.btn{font-family:inherit;font-size:16px;font-weight:600;border-radius:999px;min-height:48px;padding:0 24px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-gold{background:var(--gold);color:var(--text)}
.btn-purple{background:var(--purple);color:#fff}
.btn-ghost{background:transparent;color:var(--purple);border:1px solid var(--lav)}
.btn-text{background:none;border:none;color:var(--purple);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px}

.badge{display:inline-flex;align-items:center;background:var(--purple);color:#fff;border-radius:999px;padding:2px 14px;font-size:14px;font-weight:500;width:fit-content}
.tag{display:inline-flex;background:var(--lav);color:var(--deep);border-radius:999px;padding:0 12px;font-size:13px;font-weight:500}

.track{height:8px;background:var(--lav);border-radius:999px;overflow:hidden}
.track>span{display:block;height:100%;background:var(--purple);border-radius:999px;transition:width .4s}
.track.thick{height:14px}
.track.gold>span{background:var(--gold)}

.demo{background:var(--lav);border-radius:12px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.demo p{color:var(--deep);font-weight:500}

/* level strip */
.level{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.disc{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--surface);outline:1px solid var(--gold);line-height:1.1}
.disc b{font-size:24px;font-weight:600}
.disc small{font-size:11px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:0.5px solid var(--line);border-radius:24px;padding:4px;width:fit-content;max-width:100%}
.tabs button{font-family:inherit;font-size:15px;font-weight:500;border:none;background:none;color:var(--deep);border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--purple);color:#fff}
.cascade{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cascade>li{position:relative;padding-inline-start:28px;padding-bottom:16px}
.cascade>li::before{content:"";position:absolute;inset-inline-start:7px;top:28px;bottom:-4px;border-inline-start:1px solid var(--mauve)}
.cascade>li:last-child::before{display:none}
.cascade>li::after{content:"";position:absolute;inset-inline-start:0;top:22px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:1.5px solid var(--purple);box-sizing:border-box}
.cascade>li.now::after{background:var(--purple)}
.gk{font-size:14px;color:var(--purple);font-weight:500}
.gt{font-size:17px;font-weight:500;color:var(--deep)}
.gempty{color:var(--muted);font-size:15px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--purple);margin:0}
.todo input[type=text]{border-color:var(--line)}
.todo.done input[type=text]{color:var(--muted);text-decoration:line-through}
.todo .x{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;min-width:32px;min-height:32px;border-radius:999px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{font-family:inherit;flex:none;display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid var(--line);background:var(--surface);color:var(--deep);border-radius:12px;padding:6px 10px;min-width:58px;cursor:pointer;font-size:13px;line-height:1.4}
.day b{font-size:16px;font-weight:500}
.day[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.day.today:not([aria-pressed=true]){border-color:var(--purple)}
.day i{font-style:normal;font-size:11px;opacity:.85}
.hero{display:grid;grid-template-columns:1fr;gap:16px;align-items:center;justify-items:center;text-align:center}
@media (min-width:720px){.hero{grid-template-columns:280px 1fr;justify-items:start;text-align:start}}
.rings{width:100%;max-width:280px;height:auto}
.quote{display:flex;flex-direction:column;gap:8px;max-width:46ch}
.q{font-size:clamp(19px,4vw,28px);font-weight:600;color:var(--purple);line-height:1.35;text-wrap:balance}
@media (min-width:420px){.q{white-space:nowrap}}
.arealist{display:flex;flex-direction:column;gap:12px}
.area{gap:0;padding:0}
.area summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto 20px;gap:12px;align-items:center;padding:16px 20px;min-height:72px}
.area summary::-webkit-details-marker{display:none}
.aname{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chev{width:9px;height:9px;border-inline-end:1.6px solid var(--purple);border-bottom:1.6px solid var(--purple);transform:rotate(45deg);margin-top:-4px;transition:transform .2s;justify-self:center}
.area[open] .chev{transform:rotate(-135deg);margin-top:4px}
.abody{display:flex;flex-direction:column;gap:16px;padding:0 20px 20px;border-top:0.5px solid var(--line);padding-top:16px}
.steps-list{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.steps-list b{font-weight:500;color:var(--deep)}
.steps-list bdi{color:var(--muted);font-size:14px}
.faq{display:flex;flex-direction:column}
.faq details{border-top:0.5px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;font-weight:500;color:var(--deep)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:8px;height:8px;border-inline-end:1.6px solid var(--purple);border-bottom:1.6px solid var(--purple);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq p{padding-bottom:12px;color:var(--text)}
.stages{border-top:0.5px solid var(--line);padding-top:12px}
.stages summary{cursor:pointer;color:var(--purple);font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px}
.stages summary::-webkit-details-marker{display:none}
.stages summary::after{content:"";width:8px;height:8px;border-inline-end:1.6px solid var(--purple);border-bottom:1.6px solid var(--purple);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.stages[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.stagelist{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.stagelist li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.stagelist i{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:var(--muted)}
.stagelist li.past i{background:var(--lav);border-color:var(--lav);color:var(--deep)}
.stagelist li.cur i{background:var(--purple);border-color:var(--purple);color:#fff}
.stagelist b{font-weight:500;color:var(--deep)}
.stagelist p{font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.stats strong{color:var(--text);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:12px}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;text-align:center;font-size:12px;line-height:1.3;color:var(--muted)}
.seal i{width:40px;height:40px;border-radius:50%;border:1px dashed var(--mauve);display:flex;align-items:center;justify-content:center}
.seal.on{color:var(--text)}
.seal.on i{background:var(--gold);border:2px solid var(--surface);outline:1px solid var(--gold)}
.seal svg{width:20px;height:20px;fill:none;stroke:var(--mauve);stroke-width:1.6}
.seal.on svg{stroke:var(--text)}

/* bottleneck */
.focus{background:var(--lav);border:1.5px solid var(--purple)}
.focus .ft,.focus .lever,.focus .miles label{background:var(--surface);border-color:var(--surface)}
.focus .track{background:var(--surface)}
.focus .tag{background:var(--surface)}
.focus .muted,.focus .small.muted{color:var(--deep)}
.fromto{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}
@media (min-width:640px){.fromto{grid-template-columns:1fr auto 1fr}}
.ft{background:var(--inset);border-radius:12px;padding:12px 16px;min-width:0}
.ft span{display:block;font-size:13px;color:var(--muted)}
.ft p{font-weight:500;color:var(--deep)}
.arrow{align-self:center;justify-self:center;color:var(--mauve)}
.arrow svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
@media (max-width:639px){.arrow svg{transform:rotate(-90deg)}}
.miles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miles label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:8px 12px;border-radius:12px;border:0.5px solid var(--lav)}
.miles input{width:20px;height:20px;accent-color:var(--purple);margin-top:4px;flex:none}
.miles .done span{color:var(--muted);text-decoration:line-through}
.levers{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.levers{grid-template-columns:1fr 1fr}}
.lever{border:0.5px solid var(--lav);border-radius:12px;padding:12px 16px;min-width:0}
.lever span{display:block;font-size:13px;color:var(--purple);font-weight:500}
.lever p{overflow-wrap:anywhere}

/* life map */
.ahead{display:flex;gap:12px;align-items:center}
.ico{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--mauve);display:flex;align-items:center;justify-content:center;flex:none}
.soft .ico,.ico.lav{background:var(--lav)}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--purple);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ascore{margin-inline-start:auto;text-align:end;font-size:13px;color:var(--muted);line-height:1.2}
.ascore b{display:block;font-size:22px;color:var(--purple);font-weight:600}
.subs{display:flex;flex-direction:column;gap:10px}
.sub{display:grid;grid-template-columns:minmax(0,1fr) 88px 28px;gap:12px;align-items:center;font-size:15px}
.sub .n{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sub .v{text-align:end;font-variant-numeric:tabular-nums;color:var(--muted)}
.sub.na{color:var(--muted)}
.minline{border-top:0.5px solid var(--lav);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.minline span{font-size:13px;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.qlabel{font-weight:500;color:var(--deep)}
.hint{font-size:14px;color:var(--muted)}
input[type=text],input[type=date],textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--lav);border-radius:12px;padding:10px 14px;width:100%}
textarea{min-height:88px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--purple);outline-offset:0;border-color:var(--purple)}
input[type=range]{width:100%;accent-color:var(--purple)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:inherit;font-size:15px;min-width:44px;min-height:40px;border-radius:999px;border:1px solid var(--lav);background:var(--surface);color:var(--deep);cursor:pointer;padding:0 14px}
.pill[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--purple);width:18px;height:18px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--lav)}
.steps i.on{background:var(--purple)}
.rank{display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border:0.5px solid var(--lav);border-radius:12px;padding:14px 16px;cursor:pointer}
.rk input{accent-color:var(--purple);width:20px;height:20px;margin-top:4px}
.rk.sel{border:1px solid var(--purple)}
select{font-family:inherit;font-size:16px;border:1px solid var(--lav);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--text);width:100%}
.done-card{background:var(--lav);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.done-card p{color:var(--deep)}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:12px;padding:12px 16px;max-height:200px;overflow:auto;font-family:inherit;font-size:13px;margin:0}

footer{border-top:0.5px solid var(--line);padding-top:16px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
.toast span{background:var(--gold);color:var(--text);font-weight:600;border-radius:999px;padding:10px 22px;transition:opacity .3s,transform .3s}
.toast span.hide{opacity:0;transform:translateY(8px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar"></div>
<div class="toast" aria-live="polite"><span id="toast" class="hide"></span></div>

<script>
(function(){
document.documentElement.dir='rtl';document.documentElement.lang='ar';
var KEY='lifePlanner.v1';
var CORE=['self','rel','work','money','life'];
var DEFAULT_AREAS=[
 {id:'self',name:'أنا',icon:'self',subs:[['health','الصحة الجسدية'],['energy','الطاقة والصحة النفسية'],['learn','التعلم والتطور'],['spirit','الروحانية']]},
 {id:'rel',name:'علاقاتي',icon:'rel',subs:[['partner','الشريك'],['kids','الأبناء'],['family','العائلة (الوالدان والإخوة)'],['friends','الأصدقاء'],['network','الزملاء والشبكة المهنية']]},
 {id:'work',name:'عملي',icon:'work',subs:[['perf','الأداء والإنتاجية'],['growth','النمو والمسار المهني'],['meaning','المعنى والرضا'],['bounds','الحدود والتوازن']]},
 {id:'money',name:'مالي',icon:'money',subs:[['income','الدخل'],['spend','المصاريف والميزانية'],['save','المدخرات وصندوق الطوارئ'],['invest','الاستثمار'],['debt','الديون']]},
 {id:'life',name:'جودة الحياة',icon:'life',subs:[['things','المقتنيات'],['travel','السفر والتجارب'],['fun','الترفيه والهوايات']]}
];
var ICONS={
 self:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/>',
 rel:'<circle cx="9" cy="8.5" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M3.5 19c1-3 3-4.6 5.5-4.6S13.5 16 14.5 19"/><path d="M15 14.6c2.4-.3 4.3 1.1 5.2 3.9"/>',
 work:'<rect x="3.5" y="7.5" width="17" height="11.5" rx="2"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="M3.5 12.5h17"/>',
 money:'<ellipse cx="12" cy="7" rx="7" ry="2.8"/><path d="M5 7v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V7"/><path d="M5 12v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-5"/>',
 life:'<circle cx="12" cy="12" r="3.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/>',
 custom:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>',
 arrow:'<path d="M19 12H5"/><path d="M10 7l-5 5 5 5"/>',
 star:'<path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4 7.2 18.9l.9-5.4L4.2 9.7l5.4-.8z"/>'
};
var LEVELS=[[0,'البداية'],[100,'الوضوح'],[250,'الالتزام'],[450,'الزخم'],[700,'الثبات'],[1000,'التوازن'],[1400,'الإتقان']];
var BADGES=[['assess','أول تقييم'],['plan','خطة واضحة'],['m1','أول محطة'],['s4','٤ أسابيع متتالية'],['goal','هدف محقق']];
var XP={wgoal:15,task:5,assess:50,plan:30,mile:100,review:20,step:30,stepHalf:15,min:10,goal:150};

function svg(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function weekIdx(d){d=d||new Date();var m=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));m.setUTCDate(m.getUTCDate()-m.getUTCDay());return Math.round(m.getTime()/604800000)}
function subName(id){for(var a of S.areas)for(var s of a.subs)if(s[0]===id)return s[1];return ''}
function areaOf(id){for(var a of S.areas)for(var s of a.subs)if(s[0]===id)return a;return null}

function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return (n<10?'0':'')+n}
function isoD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

/* Data version. When the tool changes, raise DATA_V and add a step in migrate()
   so saved data from older versions is upgraded, never lost. */
var DATA_V=2;
function migrate(o){
  if(!o||typeof o!=='object')return null;
  o.areas=Array.isArray(o.areas)?o.areas:clone(DEFAULT_AREAS);
  DEFAULT_AREAS.forEach(function(d){if(!o.areas.some(function(a){return a.id===d.id}))o.areas.push(clone(d))});
  o.scores=o.scores||{};o.goals=o.goals||{};o.minimums=o.minimums||{};
  o.reviews=Array.isArray(o.reviews)?o.reviews:[];o.badges=Array.isArray(o.badges)?o.badges:[];o.history=Array.isArray(o.history)?o.history:[];
  o.cycle=o.cycle||1;
  if(o.week){o.week.kept=o.week.kept||{};o.week.days=o.week.days||{};o.week.goals=Array.isArray(o.week.goals)?o.week.goals:[]}
  o.v=DATA_V;
  return o;
}

function level(){
  var p=S.plan||{},m=p.miles||[],goal=m.length>0&&m.every(function(x){return x.d});
  var d=[!!(S.assessed||S.bottleneck),!!S.bottleneck,!!(p.from&&p.to&&m.length),!!(p.identity&&p.env&&p.ifthen),m.some(function(x){return x.d}),streak(true)>=4,goal];
  if(goal)d=d.map(function(){return true});
  var cur=d.indexOf(false);var complete=cur<0;
  return {done:d,n:complete?STAGES.length:cur+1,complete:complete,name:complete?'أكملت الدورة':STAGES[cur][0],count:d.filter(Boolean).length};
}

function summary(){
  var L=level(),t='أنت مساعد كوتشنج هادئ وعملي. هذه بيانات تقييمي لحياتي من أداة «مخطط الحياة».\n\nحلّلها وأجبني بلغة بسيطة ودافئة وبدون مبالغة:\n١. هل اختياري لعنق الزجاجة منطقي بناءً على الأرقام؟ ولماذا؟\n٢. كيف يؤثر هذا المجال على بقية المجالات؟\n٣. اقترح ٣ خطوات صغيرة للأسبوعين القادمين.\n٤. ما العائق الأكثر احتمالًا، وكيف أتجاوزه؟\n\n— التقييم (الرضا من ١٠، الأثر من ٥) —\n';
  S.areas.forEach(function(a){t+='\n'+a.name+':\n';a.subs.forEach(function(s){var v=S.scores[s[0]];t+='- '+s[1]+': '+(!v?'لم يقيّم':v.na?'لا ينطبق':'الرضا '+v.s+'، الأثر '+v.i)+'\n'});if(S.minimums[a.id])t+='  الحد الأدنى: '+S.minimums[a.id]+'\n'});
  if(S.bottleneck){var p=S.plan||{};t+='\n— عنق الزجاجة: '+subName(S.bottleneck)+' —\nمن: '+(p.from||'')+'\nإلى: '+(p.to||'')+'\nلماذا: '+(p.why||'')+'\nالهوية: '+(p.identity||'')+'\nالبيئة: '+(p.env||'')+'\nخطوة الأسبوع: '+(p.step||'')+'\nإذا... فـ: '+(p.ifthen||'')+'\nالمحطات:\n'+(p.miles||[]).map(function(m){return '- ['+(m.d?'تم':'لم يتم')+'] '+m.t}).join('\n')+'\n';}
  var G=S.goals||{};t+='\n— الأهداف عبر الزمن —\nالغاية: '+((G.purpose||{}).t||'')+'\n';[['y3','هدف ٣ سنوات'],['y1','هدف السنة']].forEach(function(x){var g=G[x[0]]||{};t+=x[1]+': '+(g.t||'')+(g.m?' · المقياس: '+g.m:'')+(g.cur!=null?' · الحالي '+g.cur:'')+(g.target!=null?' · المستهدف '+g.target:'')+(g.due?' · الموعد '+g.due:'')+'\n'});if(S.plan)t+='هدف الربع (عنق الزجاجة): '+(S.plan.to||'')+' · الموعد '+(S.plan.due||'')+'\n';
  var last=S.reviews.slice(-4);if(last.length){t+='\n— آخر المراجعات —\n'+last.map(function(r){return '- خطوة الأسبوع: '+({yes:'نعم',half:'جزئيًا',no:'ليس بعد'}[r.step])+(r.note?' · ملاحظة: '+r.note:'')+(r.next?' · سأغيّر: '+r.next:'')}).join('\n')+'\n'}
  t+='\nالدورة '+cyc()+'، المستوى '+L.n+' من 7 ('+L.name+')، المراجعات المتتالية: '+streak()+' أسابيع.';
  return t;
}

app.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT'||t.tagName==='SELECT')return;var a=t.dataset.a;
